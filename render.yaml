# render.yaml
services:
  - type: web
    name: apex-license-server
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: apex-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/apex_keys.db
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: BUILD_SIG_KEY
        sync: false
      - key: EXPECTED_INTEGRITY
        value: "6897"
      - key: SERVER_URL
        sync: false
